<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student</title>
        <link 
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
  rel="stylesheet"
/>
<script 
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>
<style>
  table{
    table-layout: fixed;
    text-align: center;
  }
</style>
</head>
<body>
    
<div>
    <div class="container">
        <h1 class="fw-medium mb-3">Stduent Records</h1>
        <div class="row align-items-center  ">
            <div class="col ">
                <input type="search" placeholder="search by name" class="form-control w-100" id="search">
                
            </div>
            <div class="col d-flex justify-content-end">
                <div class="btn-group btn-group-sm gap-2">
                <button class="btn btn-success rounded" data-bs-toggle="modal" data-bs-target="#addStudentModal">Add Students </button>
                <button class="btn-primary btn rounded" onclick="fetchAndPrintData()">Refresh</button>
                <button class="btn btn-danger rounded" id="logout">Logout</button>
                </div>              

            </div>
            
        </div>
        <!-- showing student data -->
        <div class="mt-3">
            <table class="table table-bordered table-striped w-100 align-middle ">
            <thead class="table-dark align-middle">
                <tr style="vertical-align: center">
                <th>profile</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Logout</th>
            </tr>
            </thead>
            <tbody id="studentData">

               
                

            </tbody>
        </table>
        <ul id="pagination" class="pagination justify-content-center" >


        </ul>
        </div>
    </div>
</div>

<!-- model for adding new student -->

<div class="modal fade" id="addStudentModal" data-bs-backdrop="static">
    <div class="modal-dialog " >
        
   
    <div class="modal-content">
        <div class=" border-bottom  mb-3 p-3 modal-header d-flex justify-content-between" >
         <h3 class="">Add new Student</h3>
         <button class="btn btn-sm btn-danger" type="button" data-bs-dismiss="modal">close</button>
          </div>
        <form  class="form m-3" enctype="multipart/form-data" id="form" >
            <input type="hidden" id="id">
            <input type="text" placeholder="First Name" name="firstName" class="form-control mb-2">
            <input type="text" placeholder="last Name" name="lastName" class="form-control mb-2">
            <input type="email" placeholder="email" name="email" class="form-control mb-2">
            <input type="text" placeholder="phone" name="phone" class="form-control mb-2">
            <select class="form-select mb-2" name="gender">
                 <option value="" selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <label class="form-label fw-normal">Upload Profile Picture</label>
            <input type="file" required class="form-control mb-4" name="profilePic" accept="image/">
            <div class="text-end modal-footer">
              <button type="submit" class="btn btn-success ">Create Student</button>
        
            </div>
        </form>


    </div>
    </div>
    


</div>

<!-- model for viewing student -->

  <!-- View Student Modal -->
<div class="modal fade" id="viewStudentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Student Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <img id="viewProfilePic" src="" class="rounded mb-3" width="100" />
        <p><strong>Name:</strong> <span id="viewName"></span></p>
        <p><strong>Email:</strong> <span id="viewEmail"></span></p>
        <p><strong>Phone:</strong> <span id="viewPhone"></span></p>
        <p><strong>Gender:</strong> <span id="viewGender"></span></p>
      </div>
    </div>
  </div>
</div>

<!-- updating data modal -->
 <div class="modal fade" id="editStudentModal" data-bs-backdrop="static">
    <div class="modal-dialog " >
        
   
    <div class="modal-content">
        <div class=" border-bottom  mb-3 p-3 modal-header d-flex justify-content-between" >
         <h3 class="">Add new Student</h3>
         <button class="btn btn-sm btn-danger" type="button" data-bs-dismiss="modal">close</button>
          </div>
        <form  class="form m-3" enctype="multipart/form-data" id="editStudentForm" >
            <input type="hidden" id="editStudentId">
            <input type="text" placeholder="First Name" name="firstName" class="form-control mb-2" id="editFirstName">
            <input type="text" placeholder="last Name" name="lastName" class="form-control mb-2" id="editLastName">
            <input type="email" placeholder="email" name="email" class="form-control mb-2" id="editEmail">
            <input type="text" placeholder="phone" name="phone" class="form-control mb-2" id="editPhone">
            <select class="form-select mb-2" name="gender" id="editGender">
                 <option value="" selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <label class="form-label fw-normal">Upload Profile Picture</label>
            <input type="file" class="form-control mb-4" name="profilePic" accept="image/">
            <div class="text-end modal-footer">
              <button type="submit" class="btn btn-primary ">update</button>
        
            </div>
        </form>


    </div>
    </div>
    


</div>

 

<script src="./js/student.js" defer></script>
<script src="./js/user.js" defer></script>
    
</body>
</html>
